---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  # Pull requests run only the artefact safety job; no secrets needed
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  # yamllint disable-line rule:line-length
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions: {}

env:
  tag: '0.0.1-dev0'

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: 'Test local GitHub Action'
    # Uses environment secrets, which pull requests cannot access
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Run this job in a dedicated environment so its execution and any
    # environment-scoped secrets can be gated by environment protection
    # rules (satisfies zizmor's secrets-outside-env).
    environment: 'development'
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Perform setup prior to running test(s)
      - name: 'Checkout sample project repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "lfreleng-actions/test-python-project"
          path: 'test-python-project'
          persist-credentials: false

      - name: 'Build Python project'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@cb2041b440894cd2af2b3e90c2f14ff75f0fccbe # v2.1.3
        with:
          tag: "${{ env.tag }}"
          path_prefix: 'test-python-project'

      - name: "Running local action: ${{ github.repository }}"
        uses: $/
        with:
          path_prefix: 'test-python-project'
          tag: "${{ env.tag }}"
          no_checkout: true
          op_service_account_token: "${{ secrets.op_service_account_token }}"
          one_password_item: "${{ vars.one_password_item }}"
          pypi_credential: "${{ secrets.pypi_credential }}"
          publish_disable: true

  ### Artefact cleanup/selection must never touch project files ###
  artefact-safety:
    name: 'Test artefact path safety'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Test validation and selection scripts'
        shell: bash
        run: bash tests/test-artefact-safety.sh

      - name: 'Test distribution identity check'
        shell: bash
        run: bash tests/test-verify-distributions.sh

      - name: 'Test Twine metadata check'
        shell: bash
        run: bash tests/test-check-metadata.sh

      - name: 'Test per-file release comparison'
        shell: bash
        run: bash tests/test-compare-release.sh

      - name: 'Create fixture project and distributions'
        shell: bash
        run: |
          # Fixture project with source, metadata and an unrelated file
          mkdir -p fixture/src/fixture fixture-dists
          {
            echo '[project]'
            echo 'name = "lfreleng-pypi-publish-action-fixture"'
            echo 'version = "0.0.1"'
          } > fixture/pyproject.toml
          echo '"""Fixture."""' > fixture/src/fixture/__init__.py
          echo 'unrelated' > fixture/notes.txt
          # Distributions for the release plus a file that must not upload
          for kind in wheel sdist; do
            python3 -I tests/make-distribution.py "$kind" fixture-dists \
              lfreleng-pypi-publish-action-fixture 0.0.1
          done
          echo 'not a distribution' > fixture-dists/README.txt
          find fixture -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/fixture-before.txt"

      - name: 'Upload fixture distributions'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'fixture-dists-${{ github.run_attempt }}'
          path: 'fixture-dists/'
          overwrite: true

      - name: 'Run action with artefact_path at the project root'
        id: project-root
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'fixture'
          artefact_path: '.'
          artefact_pattern: 'fixture-dists-${{ github.run_attempt }}'
          environment: 'development'
          tag: '0.0.1'
          no_checkout: true
          trusted_publishing: 'true'
          publish_disable: true

      - name: 'Run action with artefact_path in the project'
        uses: $/
        with:
          path_prefix: 'fixture'
          artefact_path: 'dist'
          artefact_pattern: 'fixture-dists-${{ github.run_attempt }}'
          environment: 'development'
          tag: '0.0.1'
          no_checkout: true
          trusted_publishing: 'true'
          publish_disable: true

      - name: 'Verify project files are unchanged'
        shell: bash
        env:
          PROJECT_ROOT_OUTCOME: "${{ steps.project-root.outcome }}"
        run: |
          # Verify project files are unchanged
          status=0
          if [ "$PROJECT_ROOT_OUTCOME" != 'failure' ]; then
            echo "Error: artefact_path '.' was not rejected ❌"
            status=1
          fi
          find fixture -path fixture/dist -prune -o -type f -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/fixture-after.txt"
          if ! diff "$RUNNER_TEMP/fixture-before.txt" \
            "$RUNNER_TEMP/fixture-after.txt"; then
            echo "Error: project files changed ❌"
            status=1
          fi
          name='lfreleng_pypi_publish_action_fixture-0.0.1'
          expected="$(printf '%s\n' "$name-py3-none-any.whl" "$name.tar.gz")"
          actual="$(cd fixture/dist && LC_ALL=C ls -A)"
          if [ "$actual" != "$expected" ]; then
            echo "Error: unexpected artefact_path content: $actual ❌"
            status=1
          fi
          if compgen -G '.pypi-publish-dist.*' > /dev/null; then
            echo "Error: selection directory was not removed ❌"
            status=1
          fi
          if compgen -G '.pypi-publish-upload.*' > /dev/null; then
            echo "Error: upload directory was not removed ❌"
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "Project files intact; distributions selected ✅"
          fi
          exit "$status"

  ### An empty project name must stop the action before any download ###
  no-project:
    name: 'Test path without a Python project'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Create directory without a Python project'
        shell: bash
        run: |
          # Directory holding no project file the action can name
          mkdir -p no-project sentinel
          echo 'not a project' > no-project/notes.txt
          # Artefact an unnamed download would fetch into staging
          echo 'sentinel' > sentinel/sentinel.txt

      - name: 'Upload sentinel artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'no-project-sentinel-${{ github.run_attempt }}'
          path: 'sentinel/'
          overwrite: true

      - name: 'Run action against the directory'
        id: no-project
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'no-project'
          environment: 'development'
          tag: '0.0.1'
          no_checkout: true
          trusted_publishing: 'true'
          publish_disable: true

      - name: 'Verify the action failed before downloading'
        shell: bash
        env:
          NO_PROJECT_OUTCOME: "${{ steps.no-project.outcome }}"
        run: |
          # Verify the action failed before downloading
          status=0
          if [ "$NO_PROJECT_OUTCOME" != 'failure' ]; then
            echo "Error: empty project name was not rejected ❌"
            status=1
          fi
          # The staging step runs before the guard, so its download
          # directory must exist and hold nothing, not even the sentinel
          shopt -s nullglob
          download_dirs=("$RUNNER_TEMP"/pypi-download.*)
          if [ "${#download_dirs[@]}" -eq 0 ]; then
            echo "Error: download staging directory not found ❌"
            status=1
          fi
          for dir in "${download_dirs[@]}"; do
            if [ -n "$(find "$dir" -mindepth 1 -print -quit)" ]; then
              echo "Error: artefacts downloaded into $dir ❌"
              find "$dir" -mindepth 1
              status=1
            fi
          done
          if [ -e no-project/dist ]; then
            echo "Error: distributions reached the artefact path ❌"
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "Empty project name rejected ✅"
          fi
          exit "$status"

  ### Distributions must match the requested project and release ###
  release-identity:
    name: 'Test distribution identity check'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Create fixture project and distributions'
        shell: bash
        run: |
          # Fixture project; its distributions are for another release
          mkdir -p fixture mismatch release invalid
          {
            echo '[project]'
            echo 'name = "lfreleng-pypi-publish-action-fixture"'
            echo 'version = "0.0.2"'
          } > fixture/pyproject.toml
          name='lfreleng-pypi-publish-action-fixture'
          for kind in wheel sdist; do
            python3 -I tests/make-distribution.py "$kind" release \
              "$name" 0.0.2
          done
          # One matching wheel mixed with an older release and a
          # distribution of another project
          cp release/*.whl mismatch/
          python3 -I tests/make-distribution.py wheel mismatch "$name" 0.0.1
          python3 -I tests/make-distribution.py sdist mismatch \
            lfreleng-other-project 0.0.2
          # The release, with a field Twine rejects in the wheel
          cp release/*.tar.gz invalid/
          python3 -I tests/make-distribution.py wheel invalid "$name" 0.0.2 \
            --header='Unknown-Field: invalid'

      - name: 'Upload mismatched distributions'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'identity-mismatch-${{ github.run_attempt }}'
          path: 'mismatch/'
          overwrite: true

      - name: 'Upload matching distributions'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'identity-release-${{ github.run_attempt }}'
          path: 'release/'
          overwrite: true

      - name: 'Upload distributions with invalid metadata'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'identity-invalid-${{ github.run_attempt }}'
          path: 'invalid/'
          overwrite: true

      - name: 'Run action with a mismatched selection'
        id: mismatch
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'fixture'
          artefact_path: 'dist-mismatch'
          artefact_pattern: 'identity-mismatch-${{ github.run_attempt }}'
          environment: 'development'
          tag: '0.0.2'
          no_checkout: true
          trusted_publishing: 'true'
          publish_disable: true

      - name: 'Run action with invalid metadata'
        id: invalid
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'fixture'
          artefact_path: 'dist-invalid'
          artefact_pattern: 'identity-invalid-${{ github.run_attempt }}'
          environment: 'development'
          tag: '0.0.2'
          no_checkout: true
          trusted_publishing: 'true'
          publish_disable: true

      - name: 'Run action with a v-prefixed tag'
        uses: $/
        with:
          path_prefix: 'fixture'
          artefact_path: 'dist-release'
          artefact_pattern: 'identity-release-${{ github.run_attempt }}'
          environment: 'development'
          tag: 'v0.0.2'
          no_checkout: true
          trusted_publishing: 'true'
          publish_disable: true

      - name: 'Verify rejected selections failed before any copy'
        shell: bash
        env:
          MISMATCH_OUTCOME: "${{ steps.mismatch.outcome }}"
          INVALID_OUTCOME: "${{ steps.invalid.outcome }}"
        run: |
          # The checks run before the copy, index query, credential
          # selection and upload steps, so a rejected selection never
          # reaches artefact_path
          status=0
          if [ "$MISMATCH_OUTCOME" != 'failure' ]; then
            echo "Error: mismatched selection was not rejected ❌"
            status=1
          fi
          if [ "$INVALID_OUTCOME" != 'failure' ]; then
            echo "Error: invalid metadata was not rejected ❌"
            status=1
          fi
          for dir in fixture/dist-mismatch fixture/dist-invalid; do
            if [ -e "$dir" ]; then
              echo "Error: rejected distributions reached $dir ❌"
              status=1
            fi
          done
          name='lfreleng_pypi_publish_action_fixture-0.0.2'
          expected="$(printf '%s\n' "$name-py3-none-any.whl" "$name.tar.gz")"
          actual="$(cd fixture/dist-release && LC_ALL=C ls -A)"
          if [ "$actual" != "$expected" ]; then
            echo "Error: unexpected artefact_path content: $actual ❌"
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "Rejected selections stopped; release accepted ✅"
          fi
          exit "$status"
