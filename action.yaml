---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# pypi-publish-action
name: '📦 PyPI Publish Package'
description: 'Publishes a Python project to the Python Package Index'

inputs:
  path_prefix:
    description: 'Directory location containing project code'
    required: false
    default: '.'
  environment:
    # When defined/used MUST match the trusted publishing setup in PyPI
    description: 'Environment used to source credentials'
    required: false
    default: 'production'
  tag:
    description: 'Tag/version string for this release/build'
    required: true
  artefact_path:
    description: 'Path/location to build artefacts'
    required: false
    default: 'dist'
  artefact_pattern:
    description: 'Pattern to download multiple artefacts'
    required: false
  one_password_item:
    description: 'Path to 1Password vault credential for PyPI'
    required: false
  op_service_account_token:
    description: '1Password service account credential to access vault'
    required: false
  pypi_credential:
    description: 'PyPI API credential from GitHub secrets'
    required: false
  trusted_publishing:
    # PyPI now supports pre-configuring trusted publishers before first publish
    # When set to 'true', trusted publishing is always attempted
    # When set to 'false', trusted publishing is never used (credential only)
    # When set to 'auto', trusted publishing requires prior package presence
    description: 'Controls trusted publishing behaviour (auto/true/false)'
    required: false
    default: 'auto'
  publish_disable:
    description: 'Disables the final publishing step that uploads packages'
    required: false
    default: 'false'
  attestations:
    description: 'Enables upload/publishing support for attestations'
    required: false
    default: 'false'
  no_checkout:
    # Required during action testing to avoid changes to local files
    description: 'Do not checkout local repository; used for testing'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Need repository content to extract project name
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.no_checkout != 'true'
      with:
        # Action only reads repository content; no credential persistence
        persist-credentials: false

    - name: "Verify path prefix"
      if: inputs.path_prefix != '.'
      shell: bash
      env:
        PATH_PREFIX: "${{ inputs.path_prefix }}"
      run: |
        # Verify path prefix is a safe, in-workspace directory path
        case "$PATH_PREFIX" in
          /*)
            echo "Error: path_prefix must be a relative path ❌"
            exit 1
            ;;
          *..*)
            echo "Error: path_prefix must not contain '..' ❌"
            exit 1
            ;;
        esac
        if [ ! -d "$PATH_PREFIX" ]; then
          echo "Error: invalid path/prefix to project directory ❌"
          exit 1
        fi
        # Ensure the resolved path stays within the workspace, so later
        # steps (e.g. 'find ... -exec rm') cannot touch external files.
        # 'cd --' stops a leading '-' in the path being read as an option.
        workspace="$(cd -- "${GITHUB_WORKSPACE:-$PWD}" && pwd -P)"
        resolved="$(cd -- "$PATH_PREFIX" && pwd -P)"
        case "$resolved/" in
          "$workspace"/*) ;;
          *)
            echo "Error: path_prefix escapes the workspace directory ❌"
            exit 1
            ;;
        esac

    - name: 'Validate artefact path'
      shell: bash
      env:
        PATH_PREFIX: "${{ inputs.path_prefix }}"
        ARTEFACT_PATH: "${{ inputs.artefact_path }}"
      run: |
        # Reject an artefact_path that resolves to the workspace, the
        # project root, a parent of it or anywhere outside the
        # workspace, before anything is downloaded or copied
        bash "$GITHUB_ACTION_PATH/scripts/validate-artefact-path.sh" \
          > /dev/null

    - name: 'Create staging directories'
      id: staging
      shell: bash
      run: |
        # Download into a new, empty directory outside the source tree.
        # The uploader runs in a container that only mounts the
        # workspace, so the selection it publishes from is a new,
        # empty directory at the workspace root that this action owns.
        workspace="$(cd -- "${GITHUB_WORKSPACE:-$PWD}" && pwd -P)"
        download_dir="$(mktemp -d "${RUNNER_TEMP:?}/pypi-download.XXXXXX")"
        selection_dir="$(mktemp -d "$workspace/.pypi-publish-dist.XXXXXX")"
        for dir in "$download_dir" "$selection_dir"; do
          if [ -n "$(ls -A -- "$dir")" ]; then
            echo "Error: staging directory is not empty: $dir ❌"
            exit 1
          fi
        done
        {
          echo "download_dir=$download_dir"
          echo "selection_dir=$selection_dir"
          echo "packages_dir=$(basename -- "$selection_dir")"
        } >> "$GITHUB_OUTPUT"

    - name: 'Extract project/repository naming'
      id: naming
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/python-project-name-action@084b052f75518277e8cecda32a6feab6e8340c14  # v0.1.12
      with:
        path_prefix: "${{ inputs.path_prefix }}"

    - name: '⬇ Download build artefacts (single)'
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.artefact_pattern == ''
      with:
        name: "${{ steps.naming.outputs.python_project_name }}"
        path: "${{ steps.staging.outputs.download_dir }}"

    - name: '⬇ Download build artefacts (pattern)'
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.artefact_pattern != ''
      with:
        pattern: "${{ inputs.artefact_pattern }}"
        path: "${{ steps.staging.outputs.download_dir }}"
        merge-multiple: true

    - name: 'Derive publishing parameters'
      id: parameters
      shell: bash
      env:
        ENVIRONMENT: "${{ inputs.environment }}"
      run: |
        # Derive publishing parameters
        if [ "$ENVIRONMENT" != "production" ]; then
          echo "base_url=https://test.pypi.org" >> "$GITHUB_ENV"
          echo "publish_url=https://test.pypi.org/legacy/" >> "$GITHUB_ENV"
        else
          echo "base_url=https://pypi.org" >> "$GITHUB_ENV"
          echo "publish_url=https://upload.pypi.org/legacy/" >> "$GITHUB_ENV"
        fi

    - name: 'Select distributions for upload'
      shell: bash
      env:
        DOWNLOAD_DIR: "${{ steps.staging.outputs.download_dir }}"
        SELECTION_DIR: "${{ steps.staging.outputs.selection_dir }}"
      run: |
        # Copy only regular *.whl and *.tar.gz files into the selection
        # the uploader publishes from; nothing is deleted anywhere
        bash "$GITHUB_ACTION_PATH/scripts/select-distributions.sh" \
          "$DOWNLOAD_DIR" "$SELECTION_DIR"

    - name: 'Copy distributions to artefact path'
      shell: bash
      env:
        PATH_PREFIX: "${{ inputs.path_prefix }}"
        ARTEFACT_PATH: "${{ inputs.artefact_path }}"
        SELECTION_DIR: "${{ steps.staging.outputs.selection_dir }}"
      run: |
        # Leave the selected distributions at path_prefix/artefact_path
        # for later steps in the calling job; adds files, deletes none
        bash "$GITHUB_ACTION_PATH/scripts/copy-distributions.sh" \
          "$SELECTION_DIR"

    - name: 'Checking package index for build/release'
      id: check-remote
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/pypi-version-check-action@81a9b76c7e6c2a1e1f32a31dd0f1a6a952ded827 # v0.2.4
      with:
        index_url: "${{ env.base_url }}/simple"
        package_name: "${{ steps.naming.outputs.python_project_name }}"
        package_version: "${{ inputs.tag }}"

    - name: 'Determine publishing method'
      id: conditions
      shell: bash
      env:
        TRUSTED_PUBLISHING: "${{ inputs.trusted_publishing }}"
        PACKAGE_MATCH: "${{ steps.check-remote.outputs.package_match }}"
        VERSION_MATCH: "${{ steps.check-remote.outputs.version_match }}"
        ENVIRONMENT: "${{ inputs.environment }}"
        OP_SERVICE_ACCOUNT_TOKEN: "${{ inputs.op_service_account_token }}"
        ONE_PASSWORD_ITEM: "${{ inputs.one_password_item }}"
        PYPI_CREDENTIAL: "${{ inputs.pypi_credential }}"
        BASE_URL: "${{ env.base_url }}"
      run: |
        # Determine publishing method

        publish_method=""
        echo "Trusted publishing mode: $TRUSTED_PUBLISHING"

        ### Trusted Publishing Override ###

        if [ "$TRUSTED_PUBLISHING" = "true" ]; then
          publish_method="Trusted Publishing"
          echo "Trusted publishing forced by input parameter ✅"
        elif [ "$TRUSTED_PUBLISHING" = "false" ]; then
          echo "Trusted publishing disabled by input parameter ⚠️"
          tp_disabled="true"
        elif [ "$TRUSTED_PUBLISHING" = "auto" ]; then
          if [ "$PACKAGE_MATCH" = "true" ]; then
            publish_method="Trusted Publishing"
            echo "Project previously published; using Trusted Publishing ✅"
          fi
        else
          echo "Error: invalid trusted_publishing" \
            "value: $TRUSTED_PUBLISHING ❌"
          echo "Valid values: auto, true, false"
          exit 1
        fi

        if [ "$VERSION_MATCH" != 'true' ]; then
          echo "This build/release has NOT previously been published ✅"
        else
          echo "This build/release has already been published ❌"
          if [ "$ENVIRONMENT" = "production" ]; then
            # This is an error for production/tagged releases
            echo "This build/release has already been published ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            # Publishing is skipped for non-production workflow runs
            publish_method="Skipped"
            echo "publish_method=$publish_method" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        if [ "$publish_method" != "Trusted Publishing" ]; then
          if [ "${tp_disabled:-false}" = "true" ]; then
            echo "Trusted publishing disabled; using fallback methods 👇🏻"
          else
            echo "Trusted publishing NOT available; using fallback methods 👇🏻"
          fi

          ### 1Password Vault Credential ###

          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ] || \
            [ -z "$ONE_PASSWORD_ITEM" ]; then
            echo "Unable to use 1Password to retrieve publishing key ❌"
            echo "Two required parameters MUST be set/available"
            echo "Secret:   op_service_account_token"
            echo "Variable: one_password_item"
          else
            echo "Publishing will use 1Password vault ✅"
            publish_method="1Password Vault"
          fi

          ### GitHub Secret ###

          if [ "$publish_method" = "1Password Vault" ]; then
            # A credential method is already selected; nothing more to do
            :
          elif [ -z "$PYPI_CREDENTIAL" ]; then
            echo "GitHub credential NOT set/available: pypi_credential"
            echo "Publishing cannot continue without a valid method ❌"
            echo "Publishing cannot continue without a valid method ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "Publishing will use GitHub secret ✅"
            publish_method="GitHub Secret"
          fi

        fi

        echo "Publishing to: $BASE_URL"
        echo "Environment: $ENVIRONMENT"
        echo "publish_method=$publish_method" >> "$GITHUB_OUTPUT"

    - name: 'Publish PyPI [Trusted Publishing]'
      # v1.12.x has changed the docker container setup/creation process
      # Currently it causes failures, and will need careful testing
      # Also, be cautious pinning v1.12.x to a SHA commit value:
      # https://github.com/pypa/gh-action-pypi-publish/discussions/287
      # yamllint disable-line rule:line-length
      uses: modeseven-lfreleng-actions/gh-action-pypi-publish@0812cff09aa305eca00eea7b144ab2a384085c3d  # v1.11.12
      # yamllint disable-line rule:line-length
      if: steps.conditions.outputs.publish_method == 'Trusted Publishing' && inputs.publish_disable == 'false'
      with:
        repository-url: "${{ env.publish_url }}"
        packages-dir: "${{ steps.staging.outputs.packages_dir }}"
        # We already validated earlier in the pipeline (twine)
        verify-metadata: false
        attestations: "${{ inputs.attestations }}"
        # Show checksum values
        print-hash: true
        # Optional debugging, pretty much essential for information on failures
        verbose: true

    - name: 'Check pinned 1Password CLI version'
      if: steps.conditions.outputs.publish_method == '1Password Vault'
      shell: bash
      run: |
        # Best-effort check that the pinned op CLI version is current.
        # The pinned value is read from the single 'version:' literal on
        # the load-secrets-action step below (one source of truth).
        # Never fails the build; only emits a reminder when outdated.
        action_file="$GITHUB_ACTION_PATH/action.yaml"
        pinned="$(sed -nE "s/^[[:space:]]*version: '([0-9.]+)'.*/\1/p" \
          "$action_file" | head -n1)"
        if [ -z "$pinned" ]; then
          echo "Could not determine pinned op CLI version ⚠️"
          exit 0
        fi
        api='https://formulae.brew.sh/api/cask/1password-cli.json'
        latest="$(curl -fsSL --max-time 10 "$api" 2>/dev/null \
          | jq -r '.version' 2>/dev/null || true)"
        if [ -z "$latest" ] || [ "$latest" = "null" ]; then
          echo "Could not determine latest 1Password CLI version ⚠️"
        elif [ "$latest" != "$pinned" ]; then
          echo "::warning title=1Password CLI pin outdated::Pinned op" \
            "CLI version $pinned; latest is $latest"
          {
            echo "### ⚠️ 1Password CLI version pin is outdated"
            echo "Pinned \`op\` CLI version: \`$pinned\`"
            echo "Latest available version: \`$latest\`"
            echo "Update the \`version:\` pin in this action when convenient."
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Pinned op CLI version is current: $pinned ✅"
        fi

    - name: 'Retrieve Credential [1Password]'
      if: steps.conditions.outputs.publish_method == '1Password Vault'
      # yamllint disable-line rule:line-length
      uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # 5.0.1
      with:
        # Export loaded secrets as environment variables
        export-env: true
        # Single source of truth for the pinned op CLI version; the
        # action default 'latest' is an unpinned external tool. The
        # preceding step reads this literal to check for newer releases.
        version: '2.34.1'
      env:
        pypi_credential: "${{ inputs.one_password_item}}"
        OP_SERVICE_ACCOUNT_TOKEN: "${{ inputs.op_service_account_token }}"

    # Used only once prior to trusted publishing being configured
    - name: 'Publish PyPI [1Password Credential]'
      # v1.12.x has changed the docker container setup/creation process
      # Currently it causes failures, and will need careful testing
      # Also, be cautious pinning v1.12.x to a SHA commit value:
      # https://github.com/pypa/gh-action-pypi-publish/discussions/287
      # yamllint disable-line rule:line-length
      uses: modeseven-lfreleng-actions/gh-action-pypi-publish@0812cff09aa305eca00eea7b144ab2a384085c3d  # v1.11.12
      # yamllint disable-line rule:line-length
      if: steps.conditions.outputs.publish_method == '1Password Vault' && inputs.publish_disable == 'false'
      with:
        repository-url: "${{ env.publish_url }}"
        packages-dir: "${{ steps.staging.outputs.packages_dir }}"
        verify-metadata: false
        # Credential resolved from 1Password and exported by the previous
        # step (load-secrets-action with export-env: true)
        password: ${{ env.pypi_credential }}
        attestations: "${{ inputs.attestations }}"
        print-hash: true
        verbose: true

    # Fallback method using credential stored as GitHub secret
    - name: 'Publish PyPI [GitHub Secret]'
      # v1.12.x has changed the docker container setup/creation process
      # Currently it causes failures, and will need careful testing
      # Also, be cautious pinning v1.12.x to a SHA commit value:
      # https://github.com/pypa/gh-action-pypi-publish/discussions/287
      # yamllint disable-line rule:line-length
      uses: modeseven-lfreleng-actions/gh-action-pypi-publish@0812cff09aa305eca00eea7b144ab2a384085c3d  # v1.11.12
      if:
        # yamllint disable-line rule:line-length
        steps.conditions.outputs.publish_method == 'GitHub Secret' && inputs.publish_disable == 'false'
      with:
        repository-url: "${{ env.publish_url }}"
        packages-dir: "${{ steps.staging.outputs.packages_dir }}"
        verify-metadata: false
        # Publishing API key stored as secret/variable in GitHub
        password: ${{ inputs.pypi_credential }}
        attestations: "${{ inputs.attestations }}"
        print-hash: true
        verbose: true

    - name: 'Print summary/job output'
      shell: bash
      env:
        PUBLISH_DISABLE: "${{ inputs.publish_disable }}"
        PUBLISH_METHOD: "${{ steps.conditions.outputs.publish_method }}"
        BASE_URL: "${{ env.base_url }}"
        PROJECT_NAME: "${{ steps.naming.outputs.python_project_name }}"
        TAG: "${{ inputs.tag }}"
      # yamllint disable rule:line-length
      run: |
        # Print summary/job output
        if [ "$PUBLISH_DISABLE" = 'true' ]; then
          echo "### Publishing Disabled: Dry Run 🛑" >> "$GITHUB_STEP_SUMMARY"
        elif [ "$PUBLISH_METHOD" = 'Skipped' ]; then
          echo "### Publishing Skipped: Previously Released ⛔️" >> "$GITHUB_STEP_SUMMARY"
        elif [ "$BASE_URL" != "https://pypi.org" ]; then
          echo '# 🧪 Test PyPI Release' >> "$GITHUB_STEP_SUMMARY"
        else
          echo '# 🚀 PyPI Release' >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "Authenticated using: $PUBLISH_METHOD" >> "$GITHUB_STEP_SUMMARY"
        if [ "$PUBLISH_DISABLE" != "true" ]; then
          echo "🔗 $BASE_URL/project/$PROJECT_NAME/$TAG/" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: 'Remove selection directory'
      if: always()
      shell: bash
      env:
        SELECTION_DIR: "${{ steps.staging.outputs.selection_dir }}"
      run: |
        # Remove only the directory this action created in the staging
        # step; the caller's files and artefact_path are left alone
        workspace="$(cd -- "${GITHUB_WORKSPACE:-$PWD}" && pwd -P)"
        case "$SELECTION_DIR" in
          "$workspace"/.pypi-publish-dist.*) ;;
          *) exit 0 ;;
        esac
        if [ -d "$SELECTION_DIR" ] && [ ! -L "$SELECTION_DIR" ]; then
          rm -rf -- "$SELECTION_DIR"
        fi
